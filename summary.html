<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Paradise - 游览汇总</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #ffffff;
            color: #000000;
            line-height: 1.6;
        }

        .summary-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .summary-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            border: 2px solid #007bff;
        }

        .summary-header h1 {
            color: #000000;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .visit-date {
            color: #000000;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            text-align: center;
        }

        .stat-card.found {
            border-color: #28a745;
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
        }

        .stat-card.not-found {
            border-color: #dc3545;
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
        }

        .stat-card.total {
            border-color: #007bff;
            background: linear-gradient(135deg, #cce7ff, #b3d9ff);
        }

        .stat-card.progress {
            border-color: #ffc107;
            background: linear-gradient(135deg, #fff3cd, #ffeaa7);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #000000;
        }

        .stat-label {
            font-size: 1rem;
            color: #000000;
            margin-top: 5px;
            font-weight: bold;
        }

        .zone-breakdown {
            margin-bottom: 40px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #e0e0e0;
        }

        .zone-breakdown h3 {
            color: #000000;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
        }

        .zone-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .zone-stat-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #e0e0e0;
        }

        .zone-name {
            font-weight: bold;
            color: #000000;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #28a745, #20c997);
            height: 100%;
            transition: width 0.3s ease;
        }

        .zone-numbers {
            font-size: 0.9rem;
            color: #000000;
            font-weight: bold;
        }

        .section-header {
            text-align: center;
            margin: 40px 0 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .found-section {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            border: 2px solid #28a745;
        }

        .not-found-section {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            color: #721c24;
            border: 2px solid #dc3545;
        }

        .birds-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .bird-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 8px;
            border: 1px solid #ddd;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .bird-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .bird-card.found {
            border-color: #28a745;
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
        }

        .bird-card.not-found {
            border-color: #dc3545;
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
        }

        .bird-image {
            width: 100%;
            height: 80px;
            object-fit: contain;
            border-radius: 5px;
            margin-bottom: 5px;
            background: white;
        }

        .bird-name {
            font-weight: bold;
            color: #000000;
            font-size: 0.8rem;
            margin-bottom: 2px;
        }

        .bird-chinese {
            color: #000000;
            font-size: 0.7rem;
            margin-bottom: 2px;
            font-weight: bold;
        }

        .bird-zone {
            color: #000000;
            font-size: 0.6rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 2px 4px;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
            font-size: 1rem;
        }

        .back-button:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .print-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
            font-size: 1rem;
        }

        .print-button:hover {
            background: #1e7e34;
            transform: translateY(-2px);
        }

        @media print {
            .back-button, .print-button {
                display: none;
            }
            
            .summary-container {
                max-width: none;
                padding: 0;
            }
            
            .birds-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 8px;
            }
            
            .bird-card {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            
            .found-section, .not-found-section {
                page-break-before: always;
            }
        }

        @media (max-width: 768px) {
            .birds-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .zone-stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="window.close()">← 返回主页</button>
    <button class="print-button" onclick="window.print()">🖨️ 打印汇总</button>
    
    <div class="summary-container">
        <div class="summary-header">
            <h1>🐦 Bird Paradise 游览汇总</h1>
            <p class="visit-date">游览日期: <span id="visitDate"></span></p>
        </div>
        
        <div class="summary-stats">
            <div class="stat-card found">
                <div class="stat-number" id="foundCount">0</div>
                <div class="stat-label">已发现</div>
            </div>
            <div class="stat-card not-found">
                <div class="stat-number" id="notFoundCount">0</div>
                <div class="stat-label">未发现</div>
            </div>
            <div class="stat-card total">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">总计</div>
            </div>
            <div class="stat-card progress">
                <div class="stat-number" id="progressPercent">0%</div>
                <div class="stat-label">完成度</div>
            </div>
        </div>
        
        <div class="zone-breakdown">
            <h3>📊 各区域统计</h3>
            <div class="zone-stats-grid" id="zoneStats">
                <!-- Zone statistics will be loaded here -->
            </div>
        </div>
        
        <div class="section-header found-section">
            ✅ 已发现的鸟类 (<span id="foundCountTitle">0</span>种)
        </div>
        <div class="birds-grid" id="foundBirdsGrid">
            <!-- Found birds will be loaded here -->
        </div>
        
        <div class="section-header not-found-section">
            ❌ 未发现的鸟类 (<span id="notFoundCountTitle">0</span>种)
        </div>
        <div class="birds-grid" id="notFoundBirdsGrid">
            <!-- Not found birds will be loaded here -->
        </div>
    </div>

    <script>
        // Load data from sessionStorage
        function loadSummaryData() {
            const summaryDataStr = sessionStorage.getItem('summaryData');
            if (!summaryDataStr) {
                document.body.innerHTML = '<div style="text-align: center; padding: 50px;"><h2>无法加载汇总数据</h2><p>请从主页面重新打开汇总页面</p></div>';
                return;
            }
            
            const summaryData = JSON.parse(summaryDataStr);
            const foundBirds = summaryData.foundBirds;
            const allBirds = summaryData.allBirds;
            const foundCount = Object.keys(foundBirds).length;
            const totalCount = allBirds.length;
            const notFoundCount = totalCount - foundCount;
            const progressPercent = Math.round((foundCount / totalCount) * 100);
            
            // Update statistics
            document.getElementById('foundCount').textContent = foundCount;
            document.getElementById('notFoundCount').textContent = notFoundCount;
            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('progressPercent').textContent = progressPercent + '%';
            document.getElementById('foundCountTitle').textContent = foundCount;
            document.getElementById('notFoundCountTitle').textContent = notFoundCount;
            
            // Update visit date
            const visitDate = new Date(summaryData.visitDate);
            document.getElementById('visitDate').textContent = visitDate.toLocaleDateString('zh-CN');
            
            // Load zone statistics
            loadZoneStatistics(foundBirds, allBirds);
            
            // Load found birds
            loadFoundBirds(foundBirds, allBirds);
            
            // Load not found birds
            loadNotFoundBirds(foundBirds, allBirds);
        }
        
        function loadZoneStatistics(foundBirds, allBirds) {
            const zoneStatsContainer = document.getElementById('zoneStats');
            
            // Group birds by zone
            const zoneGroups = {};
            allBirds.forEach(bird => {
                if (!zoneGroups[bird.zone]) {
                    zoneGroups[bird.zone] = [];
                }
                zoneGroups[bird.zone].push(bird);
            });
            
            // Calculate statistics for each zone
            const zoneStats = Object.entries(zoneGroups).map(([zone, birds]) => {
                const foundInZone = birds.filter(bird => foundBirds[bird.id]).length;
                const totalInZone = birds.length;
                const percentage = Math.round((foundInZone / totalInZone) * 100);
                
                return {
                    zone,
                    found: foundInZone,
                    total: totalInZone,
                    percentage
                };
            });
            
            // Sort by percentage (highest first)
            zoneStats.sort((a, b) => b.percentage - a.percentage);
            
            // Generate HTML
            zoneStatsContainer.innerHTML = zoneStats.map(stat => `
                <div class="zone-stat-card">
                    <div class="zone-name">${stat.zone}</div>
                    <div class="zone-progress">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${stat.percentage}%"></div>
                        </div>
                        <div class="zone-numbers">${stat.found}/${stat.total} (${stat.percentage}%)</div>
                    </div>
                </div>
            `).join('');
        }
        
        function loadFoundBirds(foundBirds, allBirds) {
            const foundBirdsGrid = document.getElementById('foundBirdsGrid');
            const foundBirdsList = allBirds.filter(bird => foundBirds[bird.id]);
            
            foundBirdsGrid.innerHTML = foundBirdsList.map(bird => `
                <div class="bird-card found">
                    <img src="${getBirdImage(bird)}" alt="${bird.name}" class="bird-image">
                    <div class="bird-name">${bird.name}</div>
                    <div class="bird-chinese">${bird.chineseName}</div>
                    <div class="bird-zone">${bird.zone}</div>
                </div>
            `).join('');
        }
        
        function loadNotFoundBirds(foundBirds, allBirds) {
            const notFoundBirdsGrid = document.getElementById('notFoundBirdsGrid');
            const notFoundBirdsList = allBirds.filter(bird => !foundBirds[bird.id]);
            
            notFoundBirdsGrid.innerHTML = notFoundBirdsList.map(bird => `
                <div class="bird-card not-found">
                    <img src="${getBirdImage(bird)}" alt="${bird.name}" class="bird-image">
                    <div class="bird-name">${bird.name}</div>
                    <div class="bird-chinese">${bird.chineseName}</div>
                    <div class="bird-zone">${bird.zone}</div>
                </div>
            `).join('');
        }
        
        function getBirdImage(bird) {
            return `images/${bird.image}`;
        }
        
        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadSummaryData);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Paradise Guide - Pokédex Style</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Bird Paradise Guide</h1>
            <p class="subtitle">Discover Amazing Birds from 10 Unique Zones</p>
        </header>

        <div class="zone-filters">
            <div class="filter-tag active" data-zone="all">All Birds</div>
            <div class="filter-tag" data-zone="wings-of-asia">🦅 Wings of Asia</div>
            <div class="filter-tag" data-zone="african-treetops">🦜 Heart of Africa</div>
            <div class="filter-tag" data-zone="crimson-wetlands">🦩 Crimson Wetlands</div>
            <div class="filter-tag" data-zone="australian-outback">🦘 Australian Outback</div>
            <div class="filter-tag" data-zone="amazonian-jewel">🦜 Amazonian Jewel</div>
            <div class="filter-tag" data-zone="lory-loft">🦜 Lory Loft</div>
            <div class="filter-tag" data-zone="mysterious-papua">🌿 Mysterious Papua</div>
            <div class="filter-tag" data-zone="penguin-cove">🐧 Penguin Cove</div>
            <div class="filter-tag" data-zone="songs-of-the-forest">🎵 Songs of the Forest</div>
            <div class="filter-tag" data-zone="birds-of-prey">🦅 Birds of Prey</div>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search for birds..." class="search-input">
            <button id="searchBtn" class="search-btn">Search</button>
        </div>

        <div class="birds-grid" id="birdsGrid">
            <!-- Birds will be dynamically loaded here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
